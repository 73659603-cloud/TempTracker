<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TempTracker</title>
    <link rel="stylesheet" href="./estilos.css" />
</head>
<body>
    <div class="app-movil">
        
        <!-- Pantalla de Inicio -->
        <div id="pantalla-inicio" class="pantalla-inicio">
            <img src="imagenes/logo.jpg" alt="Logo" class="visor-jpg logo-grande" />
            <div class="saludo-inicio">
                <span class="hola">Bienvenido a</span>
                <span class="nombre-app-grande">TempTracker</span>
            </div>
            <button id="btn-iniciar" class="btn-tech">Iniciar Rastreo Local</button>
        </div>

        <!-- Dashboard (Oculto por defecto) -->
        <div id="dashboard" class="dashboard-contenedor" style="display: none;">
            
            <header class="cabecera">
                <div class="marca">
                    <img src="imagenes/logo.jpg" alt="Logo" class="visor-jpg logo" />
                    <div class="saludo">
                        <span class="hola">Hola,</span>
                        <span class="nombre-app">TempTracker</span>
                    </div>
                </div>
                
                <div class="buscador">
                    <input type="text" id="input-ciudad" placeholder="Buscar ciudad..." spellcheck="false" autocomplete="off" />
                    <button id="btn-buscar">
                        <img src="imagenes/buscar.jpg" alt="Buscar" class="visor-jpg icono-btn" />
                    </button>
                </div>
            </header>

            <div id="alerta-clima" class="alerta-panel"></div>

            <main class="nucleo">
                <div class="ubicacion-display">
                    <img src="imagenes/ubicacion.jpg" alt="GPS" class="visor-jpg pin-gps" />
                    <h1 class="ciudad">Detectando...</h1>
                </div>
                
                <div class="clima-principal">
                    <div class="icono-api-placeholder"></div>
                    <h2 class="temp">--°C</h2>
                    <p class="clima-texto">Esperando conexión</p>
                </div>
            </main>

            <section class="nodos-grid">
                <div class="nodo-tarjeta">
                    <img src="imagenes/lluvia.jpg" alt="Lluvia" class="visor-jpg nodo-img" />
                    <div class="nodo-datos">
                        <p class="nodo-valor precipitacion">-- mm</p>
                        <p class="nodo-etiqueta">Lluvia</p>
                    </div>
                </div>

                <div class="nodo-tarjeta">
                    <img src="imagenes/uv.jpg" alt="UV" class="visor-jpg nodo-img" />
                    <div class="nodo-datos">
                        <p class="nodo-valor uv">--</p>
                        <p class="nodo-etiqueta">Índice UV</p>
                    </div>
                </div>

                <div class="nodo-tarjeta">
                    <img src="imagenes/viento.jpg" alt="Viento" class="visor-jpg nodo-img" />
                    <div class="nodo-datos">
                        <p class="nodo-valor viento">-- km/h</p>
                        <p class="nodo-etiqueta">Viento</p>
                    </div>
                </div>

                <div class="nodo-tarjeta">
                    <img src="imagenes/humedad.jpg" alt="Humedad" class="visor-jpg nodo-img" />
                    <div class="nodo-datos">
                        <p class="nodo-valor humedad">-- %</p>
                        <p class="nodo-etiqueta">Humedad</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- Botón/Enlace discreto al portafolio -->
        <div class="footer-portafolio">
            <a href="https://porfolio-ecru-nine.vercel.app/" target="_blank" rel="noopener noreferrer" class="enlace-discreto">
                Portafolio - Benjamín Ventura Torres
            </a>
        </div>

    </div>
    <script src="./codigo.js"></script>
</body>
</html>
